<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BugunQilaman</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef4fb;--card:#fff;--ink:#14243a;--mute:#5b6b80;--line:#d6e0ee;--sky1:#ffd86b;--sky2:#ff9a5c;--accent:#1f6feb;--on-sky:#3a2300;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1624;--card:#16233a;--ink:#e8eef8;--mute:#93a4bd;--line:#26364f;--accent:#5aa2ff}}
:root[data-theme="dark"]{--bg:#0d1624;--card:#16233a;--ink:#e8eef8;--mute:#93a4bd;--line:#26364f;--accent:#5aa2ff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.45}
main{max-width:520px;margin:0 auto;padding:14px 16px 24px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.top b{font-size:18px;font-weight:800}
.pbtn{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:5px 12px 5px 5px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-weight:800}
.sky{position:relative;overflow:hidden;border-radius:26px;padding:26px 22px 22px;color:var(--on-sky);background:linear-gradient(150deg,var(--sky1),var(--sky2));transition:background .4s}
.sky .big{position:absolute;right:14px;top:6px;font-size:92px;line-height:1;animation:rise 1.1s cubic-bezier(.2,.8,.2,1) both;filter:drop-shadow(0 8px 18px rgba(0,0,0,.18))}
@keyframes rise{from{transform:translateY(70px) scale(.7);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sky .big{animation:none}}
.sky h1{margin:46px 0 2px;font-size:32px;font-weight:800;line-height:1.1;max-width:78%}
.sky p{margin:0;font-size:15px;opacity:.88}
.bar{height:10px;border-radius:99px;background:rgba(255,255,255,.45);margin-top:18px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:currentColor;border-radius:99px;transition:width .4s}
.bt{font-size:13px;margin-top:6px;opacity:.85}
.weather{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.weather button{border:2px solid transparent;background:rgba(255,255,255,.55);color:inherit;border-radius:999px;padding:7px 12px;font:600 14px inherit;font-family:inherit;cursor:pointer}
.weather button[aria-pressed="true"]{border-color:currentColor;background:rgba(255,255,255,.92)}
.add{display:flex;gap:8px;margin:18px 0 10px}
.add input,.name{flex:1;min-width:0;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:16px inherit;font-family:inherit}
.add button{padding:0 18px;border:0;border-radius:14px;background:var(--accent);color:#fff;font:700 16px inherit;font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
li input{width:22px;height:22px;accent-color:var(--accent);flex:none}
li span{flex:1;word-break:break-word}
li.done span{text-decoration:line-through;color:var(--mute)}
li .del{border:0;background:none;color:var(--mute);font-size:20px;cursor:pointer;padding:4px 8px}
.empty{text-align:center;color:var(--mute);padding:22px 10px}
.count{color:var(--mute);font-size:14px;margin:4px 2px 12px}
.clear{border:0;background:none;color:var(--accent);font:600 14px inherit;font-family:inherit;cursor:pointer;padding:8px 2px}
.ov{position:fixed;inset:0;background:rgba(5,12,24,.55);display:none;align-items:flex-end;justify-content:center;z-index:20}
.ov.open{display:flex}
.sheet{width:100%;max-width:520px;max-height:88%;overflow-y:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sh b{font-size:20px}
.x{border:0;background:var(--card);color:var(--ink);width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer}
.me{display:flex;align-items:center;gap:12px}
.me .av{width:56px;height:56px;font-size:26px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.stats b{display:block;font-size:26px;font-weight:800}
.stats small{color:var(--mute);font-size:12px}
.sheet h3{margin:18px 0 8px;font-size:16px}
.day{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:8px}
.day h4{margin:0 0 6px;font-size:14px;color:var(--mute);font-weight:600}
.day p{margin:3px 0;word-break:break-word}
.day .d{color:var(--mute);text-decoration:line-through}
.day p{display:flex;gap:8px;align-items:center;justify-content:space-between}
.mv{flex:none;border:1.5px solid var(--accent);background:none;color:var(--accent);border-radius:999px;padding:4px 10px;font:600 12px inherit;font-family:inherit;cursor:pointer}
:root{--red:#d92d20;--redbg:#fdecea}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--red:#ff7b72;--redbg:#3a1a1c}}
:root[data-theme="dark"]{--red:#ff7b72;--redbg:#3a1a1c}
.add .tmi{flex:none;width:112px;padding:14px 8px}
li.late{border-color:var(--red);background:var(--redbg)}
li.late span{color:var(--red)}
.tg{display:block;font-size:13px;color:var(--mute)}
li.late .tg{color:var(--red);font-weight:600}
.day .m{color:var(--red)}
</style>
</head>
<body>
<main>
  <div class="top">
    <b>BugunQilaman</b>
    <button class="pbtn" id="pbtn" aria-label="Profilni ochish"><span class="av" id="av1">M</span><span>Profil</span></button>
  </div>

  <section class="sky" id="sky">
    <div class="big" id="icon">☀️</div>
    <h1 id="hello">Xayrli kun</h1>
    <p id="line"></p>
    <div class="bar"><i id="fill"></i></div>
    <div class="bt" id="bt"></div>
    <div class="weather" id="weather" role="group" aria-label="Ob-havoni tanlang"></div>
  </section>

  <div class="add">
    <input id="inp" placeholder="Bugun nima qilasiz?" maxlength="120" aria-label="Yangi ish">
    <input id="tm" class="tmi" type="time" aria-label="Soat">
    <button id="addBtn">Qoʻshish</button>
  </div>
  <ul id="list"></ul>
  <button class="clear" id="clear">Bajarilganlarni oʻchirish</button>
</main>

<div class="ov" id="ov">
  <div class="sheet" role="dialog" aria-label="Profil">
    <div class="sh"><b>Profil</b><button class="x" id="close" aria-label="Yopish">✕</button></div>
    <div class="me"><span class="av" id="av2">M</span><input class="name" id="name" maxlength="24" aria-label="Ismingiz" placeholder="Ismingiz"></div>
    <div class="stats">
      <div><b id="s1">0</b><small>Jami bajarilgan</small></div>
      <div><b id="s2">0</b><small>Bugun</small></div>
      <div><b id="s3">0</b><small>Faol kunlar</small></div>
    </div>
    <h3>Oldingi ish rejalar</h3>
    <div id="hist"></div>
  </div>
</div>

<script>
const W={
  sun:{i:"☀️",t:"Quyoshli",l:"Quyoshli kun. Ishlarni boshlaymiz!",a:"#ffd86b",b:"#ff9a5c",c:"#3a2300"},
  cloud:{i:"☁️",t:"Bulutli",l:"Bulutli kun. Tinchgina ishlaymiz.",a:"#cfd8e6",b:"#9fb1cc",c:"#14243a"},
  rain:{i:"🌧️",t:"Yomgʻir",l:"Yomgʻirli kun. Uyda dasturlash vaqti!",a:"#6f93c4",b:"#3b5a8a",c:"#ffffff"},
  snow:{i:"❄️",t:"Qor",l:"Qorli kun. Issiq choy va reja.",a:"#e4f1ff",b:"#a9cdf0",c:"#14304f"}
};
const MONTHS=["yanvar","fevral","mart","aprel","may","iyun","iyul","avgust","sentabr","oktabr","noyabr","dekabr"];
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,"0");
const today=(()=>{const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())})();
let tasks=[],weather="sun",name="Mehmon";
function load(){try{const s=localStorage.getItem("kunlik-reja");if(s){const d=JSON.parse(s);
  tasks=(d.tasks||[]).map(t=>({text:t.text,done:!!t.done,date:t.date||today,time:t.time||""}));
  weather=W[d.weather]?d.weather:"sun";name=d.name||"Mehmon"}}catch(e){}}
function save(){try{localStorage.setItem("kunlik-reja",JSON.stringify({tasks,weather,name}))}catch(e){}}
function fmt(d){const p=d.split("-");return parseInt(p[2],10)+"-"+MONTHS[parseInt(p[1],10)-1]}
function greet(){const h=new Date().getHours();return h<5?"Xayrli tun":h<12?"Xayrli tong":h<18?"Xayrli kun":"Xayrli kech"}
function nowHM(){const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())}
function late(t){return t.date===today&&!t.done&&t.time&&t.time<nowHM()}
function renderHero(){
  const w=W[weather],s=$("sky");
  s.style.setProperty("--sky1",w.a);s.style.setProperty("--sky2",w.b);s.style.setProperty("--on-sky",w.c);
  $("icon").textContent=w.i;$("line").textContent=w.l;
  $("hello").textContent=greet()+", "+name;
  const day=tasks.filter(t=>t.date===today),done=day.filter(t=>t.done).length;
  $("fill").style.width=(day.length?done/day.length*100:0)+"%";
  const miss=day.filter(t=>late(t)).length;
  $("bt").textContent=day.length?done+" / "+day.length+" ish bajarildi"+(miss?", "+miss+" tasi bajarilmadi":""):"Hozircha ish yoʻq";
  const ini=(name.trim()[0]||"?").toUpperCase();$("av1").textContent=ini;$("av2").textContent=ini;
  $("weather").innerHTML="";
  for(const k in W){const b=document.createElement("button");b.textContent=W[k].i+" "+W[k].t;b.setAttribute("aria-pressed",k===weather);b.onclick=()=>{weather=k;save();renderHero()};$("weather").appendChild(b)}
}
function renderTasks(){
  const ul=$("list");ul.innerHTML="";
  const day=tasks.filter(t=>t.date===today).sort((a,b)=>(a.time?1:0)===(b.time?1:0)?(a.time||"").localeCompare(b.time||""):(a.time?-1:1));
  if(!day.length)ul.innerHTML='<div class="empty">Birinchi ishni yuqoriga yozing.</div>';
  day.forEach(t=>{
    const li=document.createElement("li");if(t.done)li.className="done";else if(late(t))li.className="late";
    const cb=document.createElement("input");cb.type="checkbox";cb.checked=t.done;cb.setAttribute("aria-label","Bajarildi");
    cb.onchange=()=>{t.done=cb.checked;save();renderAll()};
    const sp=document.createElement("span");sp.textContent=t.text;
    if(t.time){const g=document.createElement("small");g.className="tg";g.textContent="🕒 "+t.time+(late(t)?"  ⚠ Bajarilmadi":"");sp.appendChild(g)}
    const d=document.createElement("button");d.className="del";d.textContent="✕";d.setAttribute("aria-label","Oʻchirish");
    d.onclick=()=>{tasks.splice(tasks.indexOf(t),1);save();renderAll()};
    li.append(cb,sp,d);ul.appendChild(li);
  });
  $("clear").style.display=day.some(t=>t.done)?"inline":"none";
}
function renderProfile(){
  $("name").value=name;
  const dn=tasks.filter(t=>t.done);
  $("s1").textContent=dn.length;
  $("s2").textContent=dn.filter(t=>t.date===today).length;
  $("s3").textContent=new Set(tasks.map(t=>t.date)).size;
  const past=tasks.filter(t=>t.date<today),days=[...new Set(past.map(t=>t.date))].sort().reverse();
  const h=$("hist");h.innerHTML="";
  if(!days.length){h.innerHTML='<div class="empty">Oldingi kunlardan reja yoʻq. Ertaga bu yerda koʻrinadi.</div>';return}
  days.forEach(d=>{
    const box=document.createElement("div");box.className="day";
    const hd=document.createElement("h4");hd.textContent=fmt(d);box.appendChild(hd);
    past.filter(t=>t.date===d).forEach(t=>{
      const p=document.createElement("p");p.className=t.done?"d":"m";
      const tx=document.createElement("span");tx.textContent=(t.done?"✓ ":"✕ ")+(t.time?t.time+" ":"")+t.text+(t.done?"":" (bajarilmadi)");p.appendChild(tx);
      if(!t.done){const m=document.createElement("button");m.className="mv";m.textContent="Bugunga koʻchirish";m.onclick=()=>{t.date=today;save();renderAll()};p.appendChild(m)}
      box.appendChild(p);
    });
    h.appendChild(box);
  });
}
function renderAll(){renderHero();renderTasks();renderProfile()}
function add(){const v=$("inp").value.trim();if(!v)return;tasks.unshift({text:v,done:false,date:today,time:$("tm").value});$("inp").value="";$("tm").value="";save();renderAll()}
$("addBtn").onclick=add;
$("inp").addEventListener("keydown",e=>{if(e.key==="Enter")add()});
$("clear").onclick=()=>{tasks=tasks.filter(t=>!(t.date===today&&t.done));save();renderAll()};
$("pbtn").onclick=()=>{renderProfile();$("ov").classList.add("open")};
$("close").onclick=()=>$("ov").classList.remove("open");
$("ov").onclick=e=>{if(e.target===$("ov"))$("ov").classList.remove("open")};
$("name").oninput=e=>{name=e.target.value.trim()||"Mehmon";save();renderHero()};
load();renderAll();
setInterval(()=>{renderHero();renderTasks()},30000);
</script>
</body>
</html>
